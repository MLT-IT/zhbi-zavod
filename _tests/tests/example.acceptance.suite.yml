# Codeception Test Suite Configuration
#
# Suite for acceptance tests.
# Perform tests in browser using the WebDriver or PhpBrowser.
# If you need both WebDriver and PHPBrowser tests - create a separate suite.

actor: AcceptanceTester
modules:
  enabled:
    #    - PhpBrowser:
    #        url: https://minvata-78.ru/

    - \Helper\Acceptance
    - \Codeception\Module\Asserts

    - WebDriver:
        url: 'https://minvata-78.ru/'
        browser: chrome
        capabilities:
          chromeOptions:
            args: ["--headless", "--disable-gpu", "--no-sandbox", "--start-maximized", "--window-size=1920x1080"]
#            args: ["--disable-gpu", "--no-sandbox", "--start-maximized", "--window-size=1920x1080"]

env:
  krovlyasp:
    modules:
      config:
        WebDriver:
          url: 'https://krovlyasp.ru'

  armatura-178:
    modules:
      config:
        WebDriver:
          url: 'https://armatura-178.ru'

step_decorators: ~
